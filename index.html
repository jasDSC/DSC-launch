<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSC Launchpad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="header-inner">
        <div class="header-top">
          <div class="header-label">
            <span class="label-bar"></span>
            <span class="label-text">INTERNE VÆRKTØJER &amp; RAPPORTERING I DIGITAL</span>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="theme-btn" id="themeBtn" title="Skift tema">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </button>
            <button class="settings-btn" id="settingsBtn" title="Indstillinger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="header-body">
          <div class="header-text">
            <h1 class="greeting"></h1>
            <p class="subtitle">Her er dit overblik over platfome og rapporter.</p>
          </div>
          <div class="date-badge" id="dateBadge"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="tiles-grid" id="tilesGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">🧩</div>
        <p>Ingen tiles endnu.</p>
        <p>Klik på tandhjulet øverst for at tilføje tiles.</p>
      </div>
    </main>

  </div>

  <div class="overlay" id="overlay"></div>

  <aside class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h2>Indstillinger</h2>
      <button class="icon-btn" id="closeSettings">✕</button>
    </div>
    <div class="settings-body">
      <div class="section-label">Tiles</div>
      <div class="tile-list" id="tileList"></div>
      <button class="add-btn" id="addTileBtn">+ Tilføj tile</button>
    </div>
  </aside>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Ny tile</h3>
        <button class="icon-btn" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <label>Titel<input type="text" id="fieldTitle" placeholder="f.eks. Align" /></label>
        <label>Kategori
          <select id="fieldCategory">
            <option value="PLATFORM">Platform</option>
            <option value="RAPPORTERING">Rapportering</option>
            <option value="ANDET">Andet</option>
          </select>
        </label>
        <label>URL<input type="url" id="fieldUrl" placeholder="https://..." /></label>
        <label>Beskrivelse<input type="text" id="fieldDesc" placeholder="Kort beskrivelse af værktøjet" /></label>
        <label>Ikon (emoji)<input type="text" id="fieldIcon" placeholder="📊" maxlength="4" /></label>
        <label>Ikonfarve
          <div class="color-row">
            <input type="color" id="fieldColor" value="#4f8ef7" />
            <span id="colorPreview" class="color-dot"></span>
          </div>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-danger" id="deleteTileBtn" style="display:none;">Slet</button>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelModal">Annuller</button>
          <button class="btn-primary" id="saveTile">Gem</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
